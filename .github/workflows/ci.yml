name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test publication safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Scan publishable files
        run: ./scripts/check-repository-hygiene.sh
      - name: Scan staged tree and reachable history
        run: |
          ./scripts/check-repository-hygiene.sh --index
          ./scripts/check-repository-hygiene.sh --history HEAD

  api:
    name: Portable transport compile
    needs: hygiene
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build portable transport
        run: swift build --target OpenAIAPI

  xcode-27:
    name: Full bridge and demo
    needs: hygiene
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, xcode-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Full release check
        run: ./scripts/release-check.sh
